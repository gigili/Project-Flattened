
#General settings
[general]
	#Use config instead of datapack
	use_config = true

	#List settings
	#Syntax: ["modid:block|weight"]
	#Example: ["minecraft:stone|2","minecraft:dirt|1"]
	#Forge tags are supported
	[general.lists]
		#Cobble gen
		block_list_cobble = ["minecraft:cobblestone|30", "minecraft:gravel|15", "minecraft:coal_ore|20", "minecraft:iron_ore|15", "minecraft:copper_ore|10", "minecraft:gold_ore|8", "minecraft:redstone_ore|10", "minecraft:lapis_ore|10", "create:zinc_ore|12", "minecraft:granite|10", "minecraft:diorite|10", "minecraft:andesite|15"]
		#Stone gen
		block_list_stone = ["minecraft:stone|40", "minecraft:granite|10", "minecraft:diorite|10", "minecraft:andesite|10", "minecraft:gravel|5", "minecraft:coal_ore|20", "minecraft:iron_ore|15", "minecraft:copper_ore|10", "minecraft:gold_ore|8", "minecraft:redstone_ore|10", "minecraft:lapis_ore|10", "create:zinc_ore|12"]
		#Basalt gen
		block_list_basalt = ["minecraft:basalt|50", "minecraft:blackstone|40", "minecraft:netherrack|40", "minecraft:nether_quartz_ore|15", "minecraft:nether_gold_ore|15", "minecraft:ancient_debris|1"]

		#Custom settings
		[general.lists.custom]
			#Custom generators
			#Syntax: [gen]
			#Gen: [type, block, list]
			#Type: cobblestone, stone
			#Block: resource location of the block below the generated block
			#List: see List settings
			#Examples:
			#custom_generators = [
			#   ["cobblestone", "minecraft:diamond_block", ["minecraft:diamond_block"]],
			#   ["cobblestone", "minecraft:dirt", ["forge:dirt"]],
			#   ["cobblestone", "minecraft:white_wool", ["minecraft:wool"]]]
			custom_generators = [["cobblestone", "minecraft:diamond_block", ["minecraft:diamond_ore|10", "minecraft:emerald_ore|5", "powah:uraninite_ore|5", "minecraft:amethyst_block|5", "minecraft:redstone_ore|8", "minecraft:nether_quartz_ore|8", "minecraft:gold_ore|8", "minecraft:copper_ore|3", "minecraft:iron_ore|5", "minecraft:coal_ore|5", "minecraft:clay_block|5"]], ["cobblestone", "minecraft:hopper", ["minecraft:gravel|10", "minecraft:coal_ore|15", "minecraft:iron_ore|12", "minecraft:copper_ore|8", "minecraft:redstone_ore|6", "minecraft:lapis_ore|4", "minecraft:gold_ore|3", "create:zinc_ore|10", "minecraft:granite|8", "minecraft:diorite|8", "minecraft:andesite|8"]], ["cobblestone", "create:chute", ["minecraft:gravel|10", "minecraft:coal_ore|15", "minecraft:iron_ore|15", "minecraft:copper_ore|8", "minecraft:redstone_ore|8", "minecraft:lapis_ore|6", "minecraft:gold_ore|6", "create:zinc_ore|12", "minecraft:granite|8", "minecraft:diorite|8", "minecraft:andesite|8"]], ["cobblestone", "create:smart_chute", ["minecraft:gravel|10", "minecraft:coal_ore|12", "minecraft:iron_ore|15", "minecraft:copper_ore|8", "minecraft:redstone_ore|10", "minecraft:lapis_ore|8", "minecraft:gold_ore|8", "create:zinc_ore|15", "minecraft:granite|8", "minecraft:diorite|8", "minecraft:andesite|8"]]]

